name: publish

# Every published GitHub release (tag = version, e.g. "1.0.8" or "v1.0.8")
# triggers an npm publish of the bundled plugin.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # NOTE: no registry-url here — it would write an empty _authToken
      # into .npmrc. Trusted publishing (OIDC) needs no auth line.
      # Trusted publishing requires npm >= 11.5.1 (node >= 22.14); node 24's
      # bundled npm may be older, so pin the latest npm explicitly.
      - run: npm install -g npm@latest

      # The release tag IS the version to publish.
      - name: Sync package.json version from the release tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - run: npm ci
      - run: npm run build

      # Trusted publishing (OIDC): no NPM_TOKEN secret needed; provenance is
      # auto-generated. Requires the npm trusted-publisher entry:
      # ashutoshsononey, provider "GitHub Actions", owner AshutoshGitMirror,
      # repo opencode-vision-plugin, workflow publish.yml, env any.
      - name: Publish to npm (OIDC)
        run: npm publish --access public
