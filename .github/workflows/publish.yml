name: publish

# Every published GitHub release (tag = version, e.g. "1.0.8" or "v1.0.8")
# triggers an npm publish of the bundled plugin.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # NOTE: no registry-url here — it would write an empty _authToken
      # into .npmrc, which npm sends to the registry and gets treated as
      # anonymous (404 on PUT). Trusted publishing (OIDC) needs no auth line.

      # The release tag IS the version to publish.
      - name: Sync package.json version from the release tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - run: npm ci
      - run: npm run build

      # Trusted publishing (OIDC): no NPM_TOKEN secret needed.
      # Requires an npm trusted-publisher entry: ashutoshsononey, provider
      # "GitHub Actions", owner AshutoshGitMirror, repo opencode-vision-plugin,
      # workflow publish.yml, environment any.
      - name: Debug OIDC env
        run: |
          echo "ID_URL=${ACTIONS_ID_TOKEN_REQUEST_URL:+SET}"
          echo "ID_TOKEN=${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+SET}"
          echo "GITHUB_ACTIONS=$GITHUB_ACTIONS"
          npm config ls
      - name: Publish to npm (OIDC)
        run: npm publish --access public --provenance
